<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PowerBook</title>
    <meta name="description" content="Ежемесячные круги чтения, личная библиотека и вся история прочитанного." />

    <!-- The card a pasted link shows in Telegram, WhatsApp and X. The site is
         one page for every address, so every link shows this one. -->
    <meta property="og:site_name" content="PowerBook" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PowerBook — читаем 30 минут в день вместе" />
    <meta property="og:description" content="Круги чтения с 2021 года: каждый день по 30 минут, месяц вместе с сообществом, в конце — обмен книгами." />
    <meta property="og:image" content="https://powerbook.kz/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Installable app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- the room's serif (Literata italic) comes from Google Fonts: connect early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#0B1C26" />
    <!-- Light or dark before the first paint, so the page never flashes the
         wrong colours. Mirrors src/shared/lib/theme.ts; dark is the default. -->
    <script>
      (function () {
        var choice = 'dark';
        try { choice = localStorage.getItem('pb.theme') || 'dark'; } catch (e) {}
        var light = choice === 'light' || (choice === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEE8DB');
      })();
    </script>

    <!-- iOS has no manifest support for these, so they are declared directly -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PowerBook" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- the app opening on an iPhone or iPad: the logo's navy with the mark, not a white flash (brand book v1.0) -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 1032px) and (device-height: 1376px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-2064x2752.png" />

    <!-- one mark, with its dots, at every size (brand book: «точки важны, логотип не меняем») -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
