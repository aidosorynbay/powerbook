<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PowerBook</title>
    <meta name="description" content="Ежемесячные круги чтения, личная библиотека и вся история прочитанного." />

    <!-- The card a pasted link shows in Telegram, WhatsApp and X. The site is
         one page for every address, so every link shows this one. -->
    <meta property="og:site_name" content="PowerBook" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PowerBook — читаем 30 минут в день вместе" />
    <meta property="og:description" content="Круги чтения с 2021 года: каждый день по 30 минут, месяц вместе с сообществом, в конце — обмен книгами." />
    <meta property="og:image" content="https://powerbook.kz/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Installable app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D1117" />
    <!-- Light or dark before the first paint, so the page never flashes the
         wrong colours. Mirrors src/shared/lib/theme.ts; dark is the default. -->
    <script>
      (function () {
        var choice = 'dark';
        try { choice = localStorage.getItem('pb.theme') || 'dark'; } catch (e) {}
        var light = choice === 'light' || (choice === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEE8DB');
      })();
    </script>

    <!-- iOS has no manifest support for these, so they are declared directly -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PowerBook" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
