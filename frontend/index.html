<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PowerBook</title>
    <meta name="description" content="Ежемесячные круги чтения, личная библиотека и вся история прочитанного." />

    <!-- Installable app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D1117" />
    <!-- Light or dark before the first paint, so the page never flashes the
         wrong colours. Mirrors src/shared/lib/theme.ts; dark is the default. -->
    <script>
      (function () {
        var choice = 'dark';
        try { choice = localStorage.getItem('pb.theme') || 'dark'; } catch (e) {}
        var light = choice === 'light' || (choice === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F5F6F8');
      })();
    </script>

    <!-- iOS has no manifest support for these, so they are declared directly -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PowerBook" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
